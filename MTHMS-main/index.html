<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CareCluster — Enterprise Hospital Management SaaS Platform. Multi-tenant, RBAC-secured, real-time healthcare management system.">
  <title>CareCluster — Hospital Management System</title>

  <!-- CSS Design System -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/landing.css">

  <!-- Favicon as inline SVG data URI -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f8cff'><path d='M3 21h18V7l-8-4v18L5 7v14z'/></svg>">
</head>
<body>
  <!-- Root element for SPA -->
  <div id="app-root"></div>

  <!-- Toast container (global) -->
  <div id="toast-container"></div>

  <!-- Modal overlay (global) -->
  <div class="modal-overlay hidden" id="modal-overlay" onclick="CareCluster.Utils.closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title"></h3>
        <button class="modal-close" onclick="CareCluster.Utils.closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <!-- Core JavaScript Modules (order matters: dependencies first) -->
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/rbac.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>

  <!-- UI Modules -->
  <script src="js/landing.js"></script>
  <script src="js/auth_ui.js"></script>
  <script src="js/intro.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/dashboard.js"></script>

  <!-- Feature Modules -->
  <script src="js/patients.js"></script>
  <script src="js/tokens.js"></script>
  <script src="js/diagnosis.js"></script>
  <script src="js/billing.js"></script>
  <script src="js/lab.js"></script>
  <script src="js/pharmacy.js"></script>
  <script src="js/discharge.js"></script>
  <script src="js/bloodbank.js"></script>
  <script src="js/ambulance.js"></script>
  <script src="js/equipment.js"></script>
  <script src="js/organ.js"></script>
  <script src="js/diet.js"></script>
  <script src="js/feedback.js"></script>
  <script src="js/nurse.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/superadmin.js"></script>

  <!-- App Orchestrator (must be last) -->
  <script src="js/app.js"></script>
</body>
</html>
